<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<link rel="manifest" href="manifest.json">
<title>Ruben Muscle Tracker V3</title>
<style>
:root{--bg:#080d18;--card:#111a2b;--card2:#18243a;--text:#f8fafc;--muted:#94a3b8;--line:#293750;--a:#f59e0b;--g:#22c55e;--r:#ef4444;--b:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:82px}
header{position:sticky;top:0;z-index:5;background:rgba(8,13,24,.95);backdrop-filter:blur(14px);padding:15px 16px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}h2{margin:5px 0 3px}h3{margin:0 0 10px}.sub,.muted{color:var(--muted)}.sub{font-size:12px}
main{max-width:760px;margin:auto;padding:10px 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:var(--card2);padding:13px;border-radius:14px}.stat b{display:block;font-size:21px;margin-top:4px}
button{border:0;border-radius:12px;padding:10px 13px;font-weight:750;background:var(--a);color:#111827;cursor:pointer}button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}button.green{background:var(--g);color:#06210e}button.blue{background:var(--b);color:#061427}button.danger{background:var(--r);color:white}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#3b2a08;color:#fbbf24;font-size:11px;font-weight:800}
.hidden{display:none}.nav{position:fixed;bottom:0;left:0;right:0;background:#0e1728;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.nav button{background:none;color:var(--muted);flex:1;max-width:150px;border-radius:0;font-size:11px;padding:12px 4px}.nav button.active{color:var(--a)}
.exercise{border-top:1px solid var(--line);padding:14px 0}.exercise:first-child{border-top:0}.exercise h3{font-size:16px}
.prev{background:#0d1525;border:1px solid var(--line);border-radius:11px;padding:8px;margin:7px 0;font-size:12px}
.sets{display:grid;grid-template-columns:30px 1fr 1fr 1fr;gap:6px;align-items:center}.sets span{color:var(--muted);font-size:11px}
input,select,textarea{background:#0b1323;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;width:100%}
.progress{height:9px;background:#243149;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--a)}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#26344c}.bar i{background:var(--g)}
.toast{display:none;position:fixed;z-index:30;bottom:92px;left:50%;transform:translateX(-50%);background:white;color:#111827;padding:10px 15px;border-radius:12px;font-weight:800}
.small{font-size:11px}.pr{color:#86efac;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:#111a2b;border:1px solid var(--line);border-radius:8px;min-height:48px;padding:5px;font-size:10px}.day.done{border-color:var(--g)}.day.today{outline:2px solid var(--a)}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tabs button{white-space:nowrap}.notice{padding:10px;border-radius:12px;background:#17243a;border:1px solid var(--line);font-size:12px}
.listrow{padding:10px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}
</style>
</head>
<body>
<header><h1>💪 Ruben Muscle Tracker</h1><div class="sub">V3 • 8 weken • 3× per week • spiermassa</div></header>
<main>
<section id="dashboard"></section>
<section id="training" class="hidden"></section>
<section id="food" class="hidden"></section>
<section id="progress" class="hidden"></section>
<section id="settings" class="hidden"></section>
</main>
<div class="nav">
<button onclick="show('dashboard')" id="n-dashboard">🏠<br>Home</button>
<button onclick="show('training')" id="n-training">🏋️<br>Train</button>
<button onclick="show('food')" id="n-food">🍗<br>Voeding</button>
<button onclick="show('progress')" id="n-progress">📈<br>Progressie</button>
<button onclick="show('settings')" id="n-settings">⚙️<br>Instellingen</button>
</div>
<div id="toast" class="toast"></div>
<script>
const KEY='ruben-muscle-v3';
const plan={
A:[['Leg press',3,'8–12'],['Chest press',3,'8–12'],['Seated row',3,'8–12'],['Leg extension',2,'10–15'],['Lat pulldown',3,'8–12'],['Lateral raise machine',2,'12–15'],['Biceps curl',2,'10–15'],['Ab crunch',2,'10–15']],
B:[['Hack squat / pendulum squat',3,'8–12'],['Incline chest press',3,'8–12'],['Seated leg curl',3,'10–15'],['Shoulder press',3,'8–12'],['Seated row',2,'8–12'],['Peck deck',2,'10–15'],['Triceps pushdown',2,'10–15'],['Calf raise',3,'10–15']],
C:[['Leg press',3,'10–15'],['Lat pulldown',3,'8–12'],['Chest press',3,'8–12'],['Leg curl',3,'10–15'],['Rear delt machine',2,'12–15'],['Lateral raise machine',2,'12–15'],['Biceps curl',2,'10–15'],['Triceps pushdown',2,'10–15'],['Ab crunch',2,'10–15'],['Calf raise',2,'10–15']]
};
const defaults={'Chest press':30,'Peck deck':45,'Shoulder press':32.5,'Seated row':57,'Triceps pushdown':60,'Biceps curl':35,'Ab crunch':30};
const base={week:1,weight:[],logs:[],food:{},history:{},lastWorkout:'A',settings:{goal:'Spiermassa',kcal:2550,protein:140}};
let db=loadDB(), currentWorkout=db.lastWorkout||'A', timer=null;

function loadDB(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||'null');
    return {...base,...x,settings:{...base.settings,...(x?.settings||{})}};
  }catch(e){return structuredClone(base)}
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return localDate()}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',1800)}
function rir(){return db.week===7?3:db.week<=1?3:db.week<=3?2:1}
function weekAvg(){const a=db.weight.slice(-7).map(x=>+x.w);return a.length?(a.reduce((a,b)=>a+b,0)/a.length).toFixed(1):'—'}
function show(id){
  ['dashboard','training','food','progress','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  document.getElementById('n-'+id).classList.add('active');
  render(id);
}
function render(id){
  if(id==='dashboard')renderDashboard();
  if(id==='training')renderTraining();
  if(id==='food')renderFood();
  if(id==='progress')renderProgress();
  if(id==='settings')renderSettings();
}
function lastFor(name){const a=db.history[name]||[];return a.length?a[a.length-1]:null}
function topOf(range){return +(String(range).split('–')[1]||12)}
function suggested(name,range){
  const last=lastFor(name),fallback=defaults[name]||'';
  if(!last)return fallback;
  if(last.reps.length && last.reps.every(r=>r>=topOf(range)))return +(last.weight+2.5).toFixed(1);
  return last.weight;
}
function renderDashboard(){
  const trained=[...new Set(db.logs.map(x=>x.date))].length;
  const doneToday=db.logs.filter(x=>x.date===today()).length;
  const pct=db.week/8*100;
  document.getElementById('dashboard').innerHTML=`
  <div class="card"><div class="row"><div><span class="tag">WEEK ${db.week} / 8</span><h2>${db.settings.goal} modus</h2><span class="muted">±${db.settings.kcal} kcal • ±${db.settings.protein} g eiwit</span></div><button onclick="show('training')">Start training</button></div><div class="progress" style="margin-top:13px"><i style="width:${pct}%"></i></div></div>
  <div class="grid"><div class="stat"><span class="muted">Gewichtgem.</span><b>${weekAvg()} kg</b></div><div class="stat"><span class="muted">RIR nu</span><b>${rir()}</b></div><div class="stat"><span class="muted">Trainingsdagen</span><b>${trained}</b></div><div class="stat"><span class="muted">Week</span><b>${db.week}/8</b></div></div>
  <div class="card"><h3>🎯 Vandaag</h3><div class="row"><span>${doneToday} oefening(en) opgeslagen</span><button class="secondary" onclick="show('training')">Training ${currentWorkout} →</button></div></div>
  <div class="card"><h3>⚖️ Wegen</h3><div class="row"><input id="winput" type="number" step=".1" placeholder="72.3 kg" style="flex:1"><button onclick="addWeight()">Opslaan</button></div></div>
  <div class="card"><h3>📅 Programma</h3><div class="row"><button class="secondary" onclick="changeWeek(-1)">←</button><b>Week ${db.week}</b><button class="green" onclick="changeWeek(1)">→</button></div><p class="muted small">${db.week===7?'Deload: ongeveer ⅔ van je normale sets.':'Bouw reps op. Haal je bij alle sets de bovenkant, verhoog dan het gewicht.'}</p></div>
  <div class="card"><h3>💡 Progressie</h3><div class="notice">De app kijkt naar je vorige training en stelt automatisch een gewicht voor. Je kunt dit altijd aanpassen.</div></div>`;
}
function changeWeek(n){db.week=Math.max(1,Math.min(8,db.week+n));save();toast('Week '+db.week);renderDashboard()}
function renderTraining(){
  const letters=['A','B','C'];
  document.getElementById('training').innerHTML=`
  <div class="card"><div class="row"><div><span class="tag">WEEK ${db.week}</span><h2>Training ${currentWorkout}</h2><span class="muted">${db.week===7?'DELOAD • ±⅔ sets':`Richtwaarde: ${rir()} RIR`}</span></div></div>
  <div class="tabs" style="margin-top:10px">${letters.map(k=>`<button class="${k===currentWorkout?'':'secondary'}" onclick="setWorkout('${k}')">${k}</button>`).join('')}</div></div>
  <div class="card">${plan[currentWorkout].map((e,i)=>exercise(e,i)).join('')}</div>
  <div class="card"><h3>⏱️ Rusttimer</h3><div class="grid"><button class="secondary" onclick="startTimer(60)">60s</button><button class="secondary" onclick="startTimer(90)">90s</button><button class="secondary" onclick="startTimer(120)">120s</button><button class="secondary" onclick="startTimer(150)">150s</button></div><h2 id="timer" style="text-align:center">00:00</h2></div>`;
}
function setWorkout(k){currentWorkout=k;db.lastWorkout=k;save();renderTraining()}
function exercise(e,i){
  const key=currentWorkout+'|'+i, old=db.logs.find(x=>x.key===key&&x.week===db.week);
  const sets=db.week===7?Math.max(1,Math.ceil(e[1]*.67)):e[1];
  const weight=old?.weight??suggested(e[0],e[2]);
  const last=lastFor(e[0]);
  const prev=last?`${last.weight} kg — ${last.reps.join(' / ')}`:'Nog geen vorige registratie';
  const hi=topOf(e[2]);
  const hint=last&&last.reps.length&&last.reps.every(r=>r>=hi)?'⬆️ Volgende keer gewicht verhogen':'🎯 Probeer meer reps dan vorige keer';
  return `<div class="exercise"><h3>${e[0]} <span class="muted">• ${sets}× ${e[2]}</span></h3><div class="prev">Vorige: <b>${prev}</b><br><span class="muted">${hint}</span></div>
  <div class="sets"><span>kg</span><input id="${key}-w" type="number" step=".5" value="${weight}"><span>RIR</span><span></span></div>
  <div class="sets" style="margin-top:6px">${Array.from({length:sets},(_,s)=>`<span>${s+1}</span><input id="${key}-r${s}" type="number" placeholder="reps" value="${old?.reps?.[s]??''}"><input id="${key}-q${s}" type="number" placeholder="${rir()}" value="${old?.rirs?.[s]??''}"><span></span>`).join('')}</div>
  <div class="row" style="margin-top:8px"><button class="green" onclick="saveEx('${key}',${sets},'${e[0].replace(/'/g,"\\'")}')">Opslaan ✓</button></div></div>`;
}
function saveEx(key,sets,name){
  const w=+document.getElementById(key+'-w').value||0,reps=[],rirs=[];
  for(let s=0;s<sets;s++){reps.push(+document.getElementById(key+'-r'+s).value||0);rirs.push(+document.getElementById(key+'-q'+s).value||rir())}
  const item={key,week:db.week,date:today(),name,weight:w,reps,rirs};
  const old=db.logs.findIndex(x=>x.key===key&&x.week===db.week);
  if(old>=0)db.logs[old]=item;else db.logs.push(item);
  if(!db.history[name])db.history[name]=[];
  const hi=db.history[name], same=hi.findIndex(x=>x.date===today()&&x.week===db.week);
  const hist={date:today(),week:db.week,weight:w,reps};
  if(same>=0)hi[same]=hist;else hi.push(hist);
  save();toast('Opgeslagen 💪');renderTraining();
}
function startTimer(sec){
  clearInterval(timer);let t=sec,el=document.getElementById('timer');
  const tick=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t<=0){clearInterval(timer);toast('Rust voorbij 🔥')}t--};
  tick();timer=setInterval(tick,1000)
}
function addWeight(){const w=+document.getElementById('winput').value;if(!w)return;db.weight.push({date:today(),w});save();toast('Gewicht opgeslagen');renderDashboard()}
function renderFood(){
  const f=db.food[today()]||{kcal:0,protein:0},kp=Math.min(100,f.kcal/db.settings.kcal*100),pp=Math.min(100,f.protein/db.settings.protein*100);
  document.getElementById('food').innerHTML=`<div class="card"><span class="tag">VANDAAG</span><h2>🍗 Voeding</h2><div class="grid"><div class="stat"><span class="muted">Calorieën</span><b>${f.kcal} / ${db.settings.kcal}</b></div><div class="stat"><span class="muted">Eiwit</span><b>${f.protein} / ${db.settings.protein} g</b></div></div><div class="bar" style="margin-top:13px"><i style="width:${kp}%"></i></div><p class="small muted">Eiwit: ${Math.round(pp)}% van doel</p></div>
  <div class="card"><h3>Dag invoeren</h3><input id="fk" type="number" placeholder="kcal" value="${f.kcal}"><br><br><input id="fp" type="number" placeholder="eiwit gram" value="${f.protein}"><br><br><button onclick="saveFood()">Opslaan</button></div>`;
}
function saveFood(){db.food[today()]={kcal:+document.getElementById('fk').value||0,protein:+document.getElementById('fp').value||0};save();toast('Voeding opgeslagen 🍗');renderFood()}
function renderProgress(){
  const names=[...new Set(Object.keys(db.history).concat(['Chest press','Peck deck','Shoulder press','Seated row','Triceps pushdown','Biceps curl']))];
  const rows=names.map(n=>{const h=db.history[n]||[],first=h[0],last=h[h.length-1],delta=first&&last?(last.weight-first.weight):0;return `<div class="row listrow"><span>${n}</span><span>${last?`<b>${last.weight} kg</b> ${delta>0?`<span class="pr">+${delta.toFixed(1)} kg</span>`:''}`:'—'}</span></div>`}).join('');
  document.getElementById('progress').innerHTML=`<div class="card"><h2>📈 Progressie</h2><p class="muted">Je ziet hier je gewichten en trainingsdagen. Meer reps met hetzelfde gewicht telt ook als progressie.</p></div>
  <div class="card"><h3>🏆 Oefeningen</h3>${rows||'<p class="muted">Nog geen trainingen opgeslagen.</p>'}</div>
  <div class="card"><h3>⚖️ Gewicht</h3><canvas id="chart" class="chart"></canvas><p class="small muted">7-daags gemiddelde: ${weekAvg()} kg</p></div>
  <div class="card"><h3>📅 Trainingskalender</h3><div class="calendar">${calendar()}</div></div>
  <div class="card"><h3>💾 Back-up</h3><div class="row"><button class="secondary" onclick="exportData()">Export</button><button class="secondary" onclick="document.getElementById('import').click()">Import</button><input id="import" type="file" accept=".json" class="hidden" onchange="importData(event)"></div></div>`;
  drawChart();
}
function calendar(){let out='';for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const s=localDate(d),done=db.logs.some(x=>x.date===s);out+=`<div class="day ${done?'done':''} ${s===today()?'today':''}">${s.slice(5)}<br>${done?'✓':''}</div>`}return out}
function drawChart(){
  const c=document.getElementById('chart');if(!c)return;const ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);
  const a=db.weight.slice(-14);ctx.clearRect(0,0,w,h);if(a.length<2){ctx.fillStyle='#94a3b8';ctx.fillText('Voer minimaal 2 wegingen in',15,35);return}
  const vals=a.map(x=>x.w),min=Math.min(...vals)-.5,max=Math.max(...vals)+.5;ctx.strokeStyle='#f59e0b';ctx.lineWidth=3;ctx.beginPath();
  vals.forEach((v,i)=>{const x=12+i*(w-24)/(vals.length-1),y=h-18-(v-min)/(max-min)*(h-40);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  ctx.fillStyle='#94a3b8';ctx.font='11px system-ui';ctx.fillText(max.toFixed(1)+' kg',10,15);ctx.fillText(min.toFixed(1)+' kg',10,h-4);
}
function renderSettings(){
  document.getElementById('settings').innerHTML=`<div class="card"><h2>⚙️ Instellingen</h2><p class="muted">Pas je persoonlijke doelen aan.</p>
  <label>Doel<select id="goal"><option>Spiermassa</option><option>Onderhoud</option><option>Cutten</option></select></label><br>
  <label>Caloriedoel<input id="skcal" type="number" value="${db.settings.kcal}"></label><br>
  <label>Eiwitdoel (g)<input id="sprotein" type="number" value="${db.settings.protein}"></label><br>
  <button onclick="saveSettings()">Opslaan</button></div>
  <div class="card"><h3>🗑️ Gegevens</h3><p class="muted">Verwijder alleen als je echt opnieuw wilt beginnen.</p><button class="danger" onclick="resetAll()">Wis alle lokale gegevens</button></div>`;
  document.getElementById('goal').value=db.settings.goal;
}
function saveSettings(){db.settings={goal:document.getElementById('goal').value,kcal:+document.getElementById('skcal').value||2550,protein:+document.getElementById('sprotein').value||140};save();toast('Instellingen opgeslagen');renderSettings()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ruben-muscle-v3-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();toast('Import gelukt');show('dashboard')}catch(err){toast('Ongeldig bestand')}};r.readAsText(f)}
function resetAll(){if(confirm('Alle lokale gegevens wissen?')){localStorage.removeItem(KEY);location.reload()}}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
show('dashboard');
</script>
</body>
</html>
