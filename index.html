<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.json"><title>Ruben Muscle Tracker</title>
<style>
:root{--bg:#080d18;--card:#111a2b;--card2:#18243a;--text:#f8fafc;--muted:#94a3b8;--line:#293750;--a:#f59e0b;--g:#22c55e;--r:#ef4444;--b:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:rgba(8,13,24,.94);backdrop-filter:blur(14px);padding:16px;border-bottom:1px solid #18243a}h1{font-size:23px;margin:0}.sub{color:var(--muted);font-size:12px}
main{max-width:760px;margin:auto;padding:10px 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:var(--card2);padding:13px;border-radius:14px}.stat b{display:block;font-size:21px;margin-top:4px}
button{border:0;border-radius:12px;padding:10px 13px;font-weight:750;background:var(--a);color:#111827}button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}button.green{background:var(--g);color:#06210e}button.blue{background:var(--b);color:#061427}.danger{background:var(--r);color:white}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#3b2a08;color:#fbbf24;font-size:11px;font-weight:800}.hidden{display:none}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0e1728;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.nav button{background:none;color:var(--muted);flex:1;max-width:150px;border-radius:0;font-size:11px;padding:12px 4px}.nav button.active{color:var(--a)}
.exercise{border-top:1px solid var(--line);padding:14px 0}.exercise:first-child{border-top:0}.exercise h3{margin:0 0 5px;font-size:16px}.prev{background:#0d1525;border:1px solid var(--line);border-radius:11px;padding:8px;margin:7px 0;font-size:12px}.sets{display:grid;grid-template-columns:30px 1fr 1fr 1fr;gap:6px;align-items:center}.sets span{color:var(--muted);font-size:11px}.sets input,input,textarea,select{background:#0b1323;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;width:100%}.progress{height:9px;background:#243149;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--a)}.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#26344c}.bar i{background:var(--g)}.bar em{background:var(--a);font-style:normal}.toast{display:none;position:fixed;z-index:30;bottom:92px;left:50%;transform:translateX(-50%);background:white;color:#111827;padding:10px 15px;border-radius:12px;font-weight:800}
.chart{width:100%;height:190px;background:#0d1525;border:1px solid var(--line);border-radius:14px}.small{font-size:11px}.pr{color:#86efac;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#111a2b;border:1px solid var(--line);border-radius:8px;min-height:48px;padding:5px;font-size:10px}.day.done{border-color:var(--g)}.day.today{outline:2px solid var(--a)}
</style>
</head>
<body>
<header><h1>💪 Ruben Muscle Tracker <span id="installBadge"></span></h1><div class="sub">8 weken • 3× per week • spiermassa</div></header>
<main>
<section id="dashboard"></section><section id="training" class="hidden"></section><section id="food" class="hidden"></section><section id="progress" class="hidden"></section>
</main>
<div class="nav">
<button onclick="show('dashboard')" id="n-dashboard">🏠<br>Home</button><button onclick="show('training')" id="n-training">🏋️<br>Train</button><button onclick="show('food')" id="n-food">🍗<br>Voeding</button><button onclick="show('progress')" id="n-progress">📈<br>Progressie</button>
</div><div id="toast" class="toast"></div>
<script>
const KEY='ruben-muscle-v2';
const plan={
A:[['Leg press',3,'8–12'],['Chest press',3,'8–12'],['Seated row',3,'8–12'],['Leg extension',2,'10–15'],['Lat pulldown',3,'8–12'],['Lateral raise machine',2,'12–15'],['Biceps curl',2,'10–15'],['Ab crunch',2,'10–15']],
B:[['Hack squat / pendulum squat',3,'8–12'],['Incline chest press',3,'8–12'],['Seated leg curl',3,'10–15'],['Shoulder press',3,'8–12'],['Seated row',2,'8–12'],['Peck deck',2,'10–15'],['Triceps pushdown',2,'10–15'],['Calf raise',3,'10–15']],
C:[['Leg press',3,'10–15'],['Lat pulldown',3,'8–12'],['Chest press',3,'8–12'],['Leg curl',3,'10–15'],['Rear delt machine',2,'12–15'],['Lateral raise machine',2,'12–15'],['Biceps curl',2,'10–15'],['Triceps pushdown',2,'10–15'],['Ab crunch',2,'10–15'],['Calf raise',2,'10–15']]
};
const defaults={'Chest press':30,'Peck deck':45,'Shoulder press':32.5,'Seated row':57,'Triceps pushdown':60,'Biceps curl':35,'Ab crunch':30};
let db=JSON.parse(localStorage.getItem(KEY)||'{"week":1,"weight":[],"logs":[],"food":{},"history":{},"lastWorkout":"A"}');
let currentWorkout=db.lastWorkout||'A', timer=null;
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',1800)}
function rir(){return db.week===7?3:db.week<=1?3:db.week<=3?2:db.week<=5?1:1}
function weekAvg(){let a=db.weight.slice(-7).map(x=>+x.w);return a.length?(a.reduce((a,b)=>a+b,0)/a.length).toFixed(1):'—'}
function show(id){['dashboard','training','food','progress'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+id).classList.add('active');render(id)}
function lastFor(name){let arr=db.history[name]||[];return arr.length?arr[arr.length-1]:null}
function suggested(name){
let last=lastFor(name), fallback=defaults[name]||'';
if(!last)return fallback;
let min=Math.min(...last.reps), max=last.reps.length?Math.max(...last.reps):0;
let top=(plan[currentWorkout].find(x=>x[0]===name)||['',0,'8–12'])[2];let hi=+top.split('–')[1]||12;
if(last.reps.every(r=>r>=hi)) return +(last.weight+2.5).toFixed(1);
return last.weight;
}
function renderDashboard(){
let totalWeeks=8, completed=db.logs.filter(x=>x.date===today()).length;
let recent=db.weight.slice(-7), avg=weekAvg();
let trainedDays=[...new Set(db.logs.map(x=>x.date))].length;
document.getElementById('dashboard').innerHTML=`<div class="card"><div class="row"><div><span class="tag">WEEK ${db.week} / 8</span><h2 style="margin:8px 0 2px">Spiermassa modus</h2><span class="muted">±2.550 kcal • ±140 g eiwit</span></div><button onclick="show('training')">Start training</button></div><div class="progress" style="margin-top:13px"><i style="width:${db.week/8*100}%"></i></div></div>
<div class="grid"><div class="stat"><span class="muted">Gewichtgem.</span><b>${avg} kg</b></div><div class="stat"><span class="muted">RIR nu</span><b>${rir()}</b></div><div class="stat"><span class="muted">Trainingsdagen</span><b>${trainedDays}</b></div><div class="stat"><span class="muted">Week</span><b>${db.week}/8</b></div></div>
<div class="card"><h3>🎯 Vandaag</h3><div class="row"><span>${completed} opgeslagen oefening(en)</span><button class="secondary" onclick="show('training')">Training ${currentWorkout} →</button></div></div>
<div class="card"><h3>⚖️ Wegen</h3><div class="row"><input id="winput" type="number" step=".1" placeholder="72.3 kg" style="flex:1"><button onclick="addWeight()">Opslaan</button></div></div>
<div class="card"><h3>📅 Week</h3><div class="row"><button class="secondary" onclick="week(-1)">←</button><b>Week ${db.week}</b><button class="green" onclick="week(1)">→</button></div><p class="muted small">${db.week===7?'Deload: ongeveer ⅔ van je normale sets.':'Bouw reps op. Alle sets bovenkant rep-range = gewicht verhogen.'}</p></div>
<div class="card"><h3>📱 App</h3><p class="muted">Deze versie slaat je gegevens lokaal op. Gebruik de browseroptie <b>Toevoegen aan startscherm</b> om hem als app te gebruiken.</p></div>`;
}
function week(n){db.week=Math.max(1,Math.min(8,db.week+n));save();toast('Week '+db.week);renderDashboard()}
function renderTraining(){
let letters=['A','B','C'];
document.getElementById('training').innerHTML=`<div class="card"><div class="row"><div><span class="tag">WEEK ${db.week}</span><h2 style="margin:7px 0">Training ${currentWorkout}</h2><span class="muted">${db.week===7?'DELOAD • ±⅔ sets':`Richtwaarde: ${rir()} RIR`}</span></div><div>${letters.map(k=>`<button class="${k===currentWorkout?'':'secondary'}" onclick="currentWorkout='${k}';db.lastWorkout='${k}';save();renderTraining()">${k}</button>`).join('')}</div></div></div>
<div class="card">${plan[currentWorkout].map((e,i)=>exercise(e,i)).join('')}</div><div class="card"><h3>⏱️ Rusttimer</h3><div class="grid"><button class="secondary" onclick="startTimer(60)">60s</button><button class="secondary" onclick="startTimer(90)">90s</button><button class="secondary" onclick="startTimer(120)">120s</button><button class="secondary" onclick="startTimer(150)">150s</button></div><h2 id="timer" style="text-align:center;margin:12px 0">00:00</h2></div>`;
}
function exercise(e,i){
let key=currentWorkout+'|'+i, old=db.logs.find(x=>x.key===key&&x.week===db.week), last=lastFor(e[0]), sets=db.week===7?Math.max(1,Math.ceil(e[1]*.67)):e[1];
let weight=old?.weight??suggested(e[0]); let prev=last?`${last.weight} kg — ${last.reps.join(' / ')}`:'Nog geen vorige registratie';
let hint=last&&last.reps.every(r=>r>=(+e[2].split('–')[1]||12))?'⬆️ Volgende keer gewicht verhogen':'🎯 Probeer meer reps dan vorige keer';
return `<div class="exercise"><h3>${e[0]} <span class="muted">• ${sets}× ${e[2]}</span></h3><div class="prev">Vorige: <b>${prev}</b><br><span class="muted">${hint}</span></div>
<div class="sets"><span>kg</span><input id="${key}-w" type="number" step=".5" value="${weight}"><span>RIR</span><span></span></div>
<div class="sets" style="margin-top:6px">${Array.from({length:sets},(_,s)=>`<span>${s+1}</span><input id="${key}-r${s}" type="number" placeholder="reps" value="${old?.reps?.[s]??''}"><input id="${key}-q${s}" type="number" placeholder="${rir()}" value="${old?.rirs?.[s]??''}"><span></span>`).join('')}</div>
<div class="row" style="margin-top:8px"><button class="green" onclick="saveEx('${key}',${sets},'${e[0].replace(/'/g,"\\'")}')">Opslaan ✓</button></div></div>`;
}
function saveEx(key,sets,name){
let w=+document.getElementById(key+'-w').value||0,reps=[],rirs=[];
for(let s=0;s<sets;s++){reps.push(+document.getElementById(key+'-r'+s).value||0);rirs.push(+document.getElementById(key+'-q'+s).value||rir())}
let old=db.logs.findIndex(x=>x.key===key&&x.week===db.week);let item={key,week:db.week,date:today(),name,weight:w,reps,rirs};
if(old>=0)db.logs[old]=item;else db.logs.push(item);
if(!db.history[name])db.history[name]=[];db.history[name].push({date:today(),week:db.week,weight:w,reps});
save();toast('Opgeslagen 💪');renderTraining();
}
function startTimer(sec){clearInterval(timer);let t=sec;let el=document.getElementById('timer');let tick=()=>{let m=String(Math.floor(t/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');el.textContent=m+':'+s;if(t<=0){clearInterval(timer);toast('Rust voorbij 🔥')}t--};tick();timer=setInterval(tick,1000)}
function addWeight(){let w=+document.getElementById('winput').value;if(!w)return;db.weight.push({date:today(),w});save();toast('Gewicht opgeslagen');renderDashboard()}
function renderFood(){
let f=db.food[today()]||{kcal:0,protein:0};let kcalPct=Math.min(100,f.kcal/2550*100),pPct=Math.min(100,f.protein/140*100);
document.getElementById('food').innerHTML=`<div class="card"><span class="tag">VANDAAG</span><h2>🍗 Voeding</h2><div class="grid"><div class="stat"><span class="muted">Calorieën</span><b>${f.kcal} / 2.550</b></div><div class="stat"><span class="muted">Eiwit</span><b>${f.protein} / 140 g</b></div></div><div class="bar" style="margin-top:13px"><i style="width:${kcalPct}%"></i></div><p class="small muted">Eiwit: ${Math.round(pPct)}% van doel</p></div>
<div class="card"><h3>Dag invoeren</h3><input id="fk" type="number" placeholder="kcal" value="${f.kcal}"><br><br><input id="fp" type="number" placeholder="eiwit gram" value="${f.protein}"><br><br><button onclick="saveFood()">Opslaan</button></div>
<div class="card"><h3>🍝 Weekmenu</h3><ul><li>Ma — Kip teriyaki + rijst</li><li>Di — Schnitzel + krieltjes + sperziebonen</li><li>Wo — Kip curry + rijst</li><li>Do — Spaghetti bolognese</li><li>Vr — Burgers + aardappeltjes</li><li>Za — Kipshoarma + pita</li><li>Zo — Kippenpoten + aardappelen + groenten</li></ul></div>`;
}
function saveFood(){db.food[today()]={kcal:+document.getElementById('fk').value||0,protein:+document.getElementById('fp').value||0};save();toast('Voeding opgeslagen 🍗');renderFood()}
function renderProgress(){
let names=['Chest press','Peck deck','Shoulder press','Seated row','Triceps pushdown','Biceps curl','Ab crunch'];
let rows=names.map(n=>{let h=db.history[n]||[];let first=h[0],last=h[h.length-1],delta=first&&last?(last.weight-first.weight).toFixed(1):null;return `<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${n}</span><span>${last?`<b>${last.weight} kg</b> ${delta>0?'<span class="pr">+'+delta+' kg</span>':''}`:'—'}</span></div>`}).join('');
document.getElementById('progress').innerHTML=`<div class="card"><h2>📈 Progressie</h2><p class="muted">Je doel is niet alleen zwaarder worden, maar over weken heen meer reps/gewicht met goede techniek.</p></div>
<div class="card"><h3>🏆 Kracht</h3>${rows}</div>
<div class="card"><h3>⚖️ Gewichtsgrafiek</h3><canvas id="chart" class="chart"></canvas><p class="small muted">7-daags gemiddelde: ${weekAvg()} kg</p></div>
<div class="card"><h3>📅 Trainingskalender</h3><div class="calendar">${calendar()}</div></div>
<div class="card"><h3>💾 Gegevens</h3><div class="row"><button class="secondary" onclick="exportData()">Export</button><button class="secondary" onclick="document.getElementById('import').click()">Import</button><input id="import" type="file" accept=".json" class="hidden" onchange="importData(event)"></div><p class="small muted">Bewaar een export als back-up.</p></div>
<div class="card"><button class="danger" onclick="resetAll()">Wis alles</button></div>`;
drawChart();
}
function calendar(){let out='';for(let i=13;i>=0;i--){let d=new Date(Date.now()-i*864e5),s=d.toISOString().slice(0,10),done=db.logs.some(x=>x.date===s);out+=`<div class="day ${done?'done':''} ${s===today()?'today':''}">${s.slice(5)}<br>${done?'✓':''}</div>`}return out}
function drawChart(){let c=document.getElementById('chart');if(!c)return;let ctx=c.getContext('2d'),w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2;ctx.scale(2,2);w/=2;h/=2;ctx.clearRect(0,0,w,h);let a=db.weight.slice(-14);if(a.length<2){ctx.fillStyle='#94a3b8';ctx.fillText('Voer minimaal 2 wegingen in',15,35);return}let vals=a.map(x=>x.w),min=Math.min(...vals)-.5,max=Math.max(...vals)+.5;ctx.strokeStyle='#f59e0b';ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>{let x=12+i*(w-24)/(vals.length-1),y=h-18-(v-min)/(max-min)*(h-40);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#94a3b8';ctx.font='11px system-ui';ctx.fillText(max.toFixed(1)+' kg',10,15);ctx.fillText(min.toFixed(1)+' kg',10,h-4)}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ruben-muscle-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();toast('Import gelukt');show('dashboard')}catch{toast('Ongeldig bestand')}};r.readAsText(f)}
function resetAll(){if(confirm('Alle lokale gegevens wissen?')){localStorage.removeItem(KEY);location.reload()}}
show('dashboard');
</script>
</body></html>
